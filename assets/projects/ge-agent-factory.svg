</style><rect width="888" height="232" rx="16" fill="var(--bg)" stroke="var(--border)"/><text class="green" x="38" y="40" font-size="14">GE-AGENT-FACTORY</text><text class="fg" x="38" y="70" font-size="23" font-weight="700">Intent → contract → proof → admission</text><path d="M214 140 H236" stroke="var(--green)" stroke-width="2"/><path d="M230 134 l8 6 -8 6" fill="none" stroke="var(--green)" stroke-width="2"/><path d="M426 140 H448" stroke="var(--green)" stroke-width="2"/><path d="M442 134 l8 6 -8 6" fill="none" stroke="var(--green)" stroke-width="2"/><path d="M638 140 H660" stroke="var(--green)" stroke-width="2"/><path d="M654 134 l8 6 -8 6" fill="none" stroke="var(--green)" stroke-width="2"/><rect class="box" x="38" y="104" width="176" height="72" rx="12"/><text class="fg" x="126" y="134" text-anchor="middle" font-size="15" font-weight="700">Intent</text><rect class="box" x="250" y="104" width="176" height="72" rx="12"/><text class="fg" x="338" y="134" text-anchor="middle" font-size="15" font-weight="700">Contract</text><rect class="box" x="462" y="104" width="176" height="72" rx="12"/><text class="fg" x="550" y="134" text-anchor="middle" font-size="15" font-weight="700">Code · Twins · Evals</text><rect class="box" x="674" y="104" width="176" height="72" rx="12"/><text class="fg" x="762" y="134" text-anchor="middle" font-size="15" font-weight="700">Passport · Admission</text><text class="muted" x="38" y="210" font-size="13">The same factory machinery is exercised across hundreds of horizontal and vertical agent specifications.</text></svg>