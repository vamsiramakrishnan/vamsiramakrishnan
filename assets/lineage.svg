<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Idea lineage — essays to systems</title><desc id="desc">A map connecting published theses to software systems.</desc>
<style>
:root{color-scheme:light dark}.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}.fg{fill:#f0f6fc}.muted{fill:#8b949e}.essay{fill:#58a6ff}.repo{fill:#3fb950}.edge{stroke:#30363d;stroke-width:2;fill:none}.edge2{stroke:#58a6ff;stroke-width:2;fill:none;stroke-dasharray:6 7}.label{font:600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font:700 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:light){.bg{fill:#fff}.box{fill:#f6f8fa;stroke:#d0d7de}.fg{fill:#1f2328}.muted{fill:#57606a}.essay{fill:#0969da}.repo{fill:#1a7f37}.edge{stroke:#d0d7de}.edge2{stroke:#0969da}}
</style>
<rect class="bg" width="1200" height="560" rx="18"/>
<text class="fg h" x="54" y="48">THESIS → SYSTEM</text><text class="muted small" x="54" y="74">the essays are not commentary; they are design pressure that turns into code</text>
<text class="essay label" x="60" y="118">PUBLISHED THESIS</text><text class="repo label" x="790" y="118">IMPLEMENTATION</text>
<!-- essays -->
<g><rect class="box" x="54" y="140" width="430" height="72" rx="12"/><text class="fg label" x="76" y="170">Agents are at Docker...</text><text class="muted small" x="76" y="194">coordination layers capture the durable value</text></g>
<g><rect class="box" x="54" y="230" width="430" height="72" rx="12"/><text class="fg label" x="76" y="260">Winter is Coming</text><text class="muted small" x="76" y="284">production agents inherit distributed-systems physics</text></g>
<g><rect class="box" x="54" y="320" width="430" height="72" rx="12"/><text class="fg label" x="76" y="350">The Asymptote of Good Enough</text><text class="muted small" x="76" y="374">optimize where marginal user value still moves</text></g>
<g><rect class="box" x="54" y="410" width="430" height="72" rx="12"/><text class="fg label" x="76" y="440">Tacit Code, Real Friction</text><text class="muted small" x="76" y="464">AI lowers code cost; integration friction becomes the moat</text></g>
