<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>:root{--bg:#0d1117;--panel:#161b22;--fg:#f0f6fc;--muted:#8b949e;--border:#30363d;--green:#3fb950;--blue:#58a6ff}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="42" y="42" width="1116" height="546" rx="22" fill="var(--panel)" stroke="var(--border)"/><text x="82" y="108" fill="var(--green)" font-size="18">SYSTEMS.LOG / GITHUB</text><text x="82" y="190" fill="var(--fg)" font-size="58" font-weight="800">VAMSI RAMAKRISHNAN</text><text x="82" y="250" fill="var(--blue)" font-size="27">I build the machinery around models.</text><line x1="82" y1="300" x2="1118" y2="300" stroke="var(--border)"/><text x="82" y="362" fill="var(--fg)" font-size="22">COMPILERS · RUNTIMES · CONTROL PLANES · DURABILITY · EVALS</text><text x="82" y="422" fill="var(--muted)" font-size="20">The model can improvise. The system should know what happened.</text><text x="82" y="526" fill="var(--green)" font-size="20">github.com/vamsiramakrishnan</text><text x="1118" y="526" text-anchor="end" fill="var(--muted)" font-size="16">spec → system → evidence → repeat</text></svg>