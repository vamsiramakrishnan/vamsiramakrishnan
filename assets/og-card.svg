</style><rect width="1200" height="630" fill="var(--bg)"/><rect class="box" x="42" y="42" width="1116" height="546" rx="22"/><text class="green" x="82" y="108" font-size="18">SYSTEMS.LOG / GITHUB</text><text class="fg" x="82" y="190" font-size="58" font-weight="800">Vamsi Ramakrishnan</text><text class="blue" x="82" y="250" font-size="27">I build the machinery around models.</text><line x1="82" y1="300" x2="1118" y2="300" stroke="var(--border)"/><text class="fg" x="82" y="362" font-size="22">COMPILERS · RUNTIMES · CONTROL PLANES · DURABILITY · EVALS</text><text class="muted" x="82" y="422" font-size="20">The model can improvise. The system should know what happened.</text><text class="green" x="82" y="526" font-size="20">github.com/vamsiramakrishnan</text><text class="muted" x="1118" y="526" text-anchor="end" font-size="16">spec → system → evidence → repeat</text></svg>