name: Refresh profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - "portfolio.yaml"
      - "scripts/generate_portfolio.py"
      - "scripts/generate_activity.py"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install generator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Generate portfolio projections
        run: python3 scripts/generate_portfolio.py
      - name: Generate contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: vamsiramakrishnan
        run: python3 scripts/generate_activity.py
      - name: Commit changed projections
        run: |
          if git diff --quiet -- assets site generated; then
            echo "portfolio projections unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets site generated
          git commit -m "chore(profile): refresh generated portfolio"
          git push
